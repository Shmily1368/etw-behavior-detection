name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify assets and feature semantics
        run: |
          python scripts/check_assets.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir results
          build/feature_replay --input examples/resolved-stacks.tsv --method legacy > results/legacy.tsv
          build/feature_replay --input examples/resolved-stacks.tsv --method frequency > results/frequency.tsv
          python scripts/pack_features.py --input results/legacy.tsv --dictionary models/API.csv --provenance-kind synthetic-test --provenance-description "Synthetic aggregation contract fixture, not ETW capture" > results/features.ndjson
          python benchmarks/measure_representation.py results/legacy.tsv results/frequency.tsv > results/representation.ndjson
      - uses: actions/upload-artifact@v4
        with:
          name: feature-contract-results
          path: results/
  java-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: detector/pom.xml
      - name: Build and test standalone detector
        run: |
          mvn --batch-mode --no-transfer-progress -f detector/pom.xml verify
          python scripts/check_jar_notices.py detector/target/etw-behavior-detector-0.1.0.jar
      - name: Replay synthetic contract fixtures
        run: |
          mkdir results
          java -jar detector/target/etw-behavior-detector-0.1.0.jar --input examples/features.ndjson --output results/predictions.ndjson --model models/random_forest.pmml --dictionary models/API.csv --manifest models/manifest.json
          python scripts/verify_predictions.py results/predictions.ndjson
          java -jar detector/target/etw-behavior-detector-0.1.0.jar --input examples/features.ndjson --output results/predictions-repeat.ndjson --model models/random_forest.pmml --dictionary models/API.csv --manifest models/manifest.json
          cmp results/predictions.ndjson results/predictions-repeat.ndjson
      - uses: actions/upload-artifact@v4
        with:
          name: detector-java11
          path: |
            detector/target/etw-behavior-detector-0.1.0.jar
            results/predictions.ndjson
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64 binaries
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: collector-windows-x64
          path: |
            build/Release/etw_capture.exe
            build/Release/feature_replay.exe

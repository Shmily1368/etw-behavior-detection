# Define the types of logger and level of logging    
log4j.rootLogger = ERROR,console,ROLLING_FILE


# Define Console Appender    
log4j.appender.console=org.apache.log4j.ConsoleAppender    

# Define the layout for console appender. If you do not 
# define it, you will get an error    
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{YYYY-MM-dd HH:mm:ss}-[%t]-%p-%C:%m%n

log4j.logger.org.apache.kafka=ERROR

log4j.appender.ROLLING_FILE=org.apache.log4j.RollingFileAppender 
#log4j.appender.ROLLING_FILE.Threshold=ERROR
log4j.appender.ROLLING_FILE.File=logs/log 
log4j.appender.ROLLING_FILE.Append=true 
log4j.appender.ROLLING_FILE.MaxFileSize=100MB
log4j.appender.ROLLING_FILE.MaxBackupIndex=20 
log4j.appender.ROLLING_FILE.layout=org.apache.log4j.PatternLayout 
log4j.appender.ROLLING_FILE.layout.ConversionPattern=%d{YYYY-MM-dd HH:mm:ss}-[%t]-%p-%C:%m%n

